<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Family Call</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.1.0/mqttws31.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#0b0f14;color:#fff;min-height:100vh}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:#fff}
input{font-family:inherit;outline:none;border:none;color:#fff}
/* LOGIN */
#loginPage{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;background:radial-gradient(600px 300px at 50% 0%,#1e293b 0%,#0b0f14 60%)}
.loginCard{width:100%;max-width:380px;background:#111827;border:1px solid #1f2937;border-radius:22px;padding:24px}
.loginCard h1{font-size:28px;margin-bottom:6px}.loginCard p{color:#9ca3af;font-size:13px;margin-bottom:20px}
.loginCard label{font-size:12px;color:#9ca3af}
.loginCard input{width:100%;background:#0b0f14;border:1px solid #374151;border-radius:12px;padding:13px 14px;margin:8px 0 14px;font-size:16px}
.loginCard input:focus{border-color:#25d366}
.btnGreen{width:100%;background:#25d366;color:#06130a;font-weight:800;padding:14px;border-radius:12px;font-size:16px}
/* APP */
#appPage{display:none;min-height:100vh;padding:14px 12px 90px;max-width:520px;margin:0 auto}
.topBar{display:flex;align-items:center;justify-content:space-between;padding:6px 4px 14px}
.topBar h2{font-size:20px}.topBar span{font-size:12px;color:#9ca3af}
.logoutBtn{background:#1f2937;padding:8px 12px;border-radius:999px;font-size:12px}
/* TABS */
.tabs{display:flex;background:#111827;border-radius:999px;padding:4px;margin-bottom:14px}
.tabs button{flex:1;padding:10px;border-radius:999px;font-size:14px;color:#9ca3af;font-weight:600}
.tabs button.active{background:#25d366;color:#06130a}
/* CARD - BORDER FIX + EXPAND FIX */
.card{background:#111827;border:none!important;border-radius:20px;padding:14px 6px!important;overflow:hidden}
.stickyHead{padding:0 8px 14px!important;margin:0!important;border:none!important;border-bottom:none!important}
.searchBox{display:flex;background:#0b0f14;border:1px solid #1f2937;border-radius:12px;padding:10px 12px;margin-bottom:10px}
.searchBox input{flex:1;background:transparent;font-size:14px}
.filterRow{display:flex;gap:8px}
.filterRow button{padding:8px 14px;border-radius:999px;background:#1f2937;font-size:13px;color:#d1d5db}
.filterRow button.active{background:#fff;color:#111}
.listScroll{padding:14px 2px 10px!important;margin-top:6px!important;max-height:62vh;overflow-y:auto}
/* CONTACT CARD - FULL WIDTH */
.contact,.log{width:100%!important;max-width:100%!important;margin:0 0 10px!important;padding:16px 12px!important;display:flex;align-items:center;gap:12px;background:#0f172a;border:none!important;border-radius:16px}
.contact:active,.log:active{background:#1f2937}
.avatar{width:52px;height:52px;min-width:52px;border-radius:50%;background:#25d366;color:#06130a;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;position:relative}
.dot{position:absolute;right:0;bottom:0;width:14px;height:14px;border-radius:50%;border:2px solid #0f172a;background:#6b7280}
.dot.on{background:#25d366}
.cInfo{flex:1;min-width:0}.cInfo b{font-size:16px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cInfo small{color:#9ca3af;font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.callBtns{display:flex;gap:8px}
.iconBtn{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;background:#1f2937}
.iconBtn.green{background:#25d366;color:#06130a}
.iconBtn.blue{background:#2563eb}
.empty{padding:30px 10px;text-align:center;color:#9ca3af;font-size:14px}
.addForm{display:flex;gap:8px;margin-bottom:12px}
.addForm input{flex:1;background:#0b0f14;border:1px solid #374151;border-radius:12px;padding:12px}
.addBtn{background:#25d366;color:#06130a;font-weight:800;padding:12px 16px;border-radius:12px}
/* CALL SCREEN */
#callScreen{position:fixed;inset:0;background:#000;z-index:99;display:none;flex-direction:column}
#remoteVideo{width:100%;flex:1;object-fit:cover;background:#111}
.callTop{padding:16px;text-align:center}
.callTop b{font-size:20px}.callTop p{color:#9ca3af;font-size:13px;margin-top:4px}
.callControls{display:flex;justify-content:center;gap:16px;padding:18px 18px 28px}
.ctrl{width:58px;height:58px;border-radius:50%;background:#2a2a2a;display:flex;align-items:center;justify-content:center;font-size:22px;flex-direction:column}
.ctrl small{font-size:9px;margin-top:2px}
.ctrl.active{background:#f59e0b;color:#000}
.ctrl.red{background:#ef4444}
.ctrl.green{background:#25d366;color:#06130a}
#incomingBox{position:fixed;left:12px;right:12px;bottom:90px;background:#111827;border:1px solid #374151;border-radius:18px;padding:16px;z-index:100;display:none;align-items:center;gap:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:100px;background:#fff;color:#111;padding:10px 16px;border-radius:999px;font-size:13px;font-weight:600;z-index:200;display:none}
</style>
</head>
<body>

<div id="loginPage">
<div class="loginCard">
<h1>Family Call 👋</h1><p>Apna Number daalo, Family se baat karo - Kahi se bhi.</p>
<label>Apna Naam</label><input id="myName" placeholder="e.g. Mohammed">
<label>Apna Mobile Number</label><input id="myNum" placeholder="e.g. 9876543210" inputmode="numeric">
<button class="btnGreen" onclick="doLogin()">Continue →</button>
<p style="margin-top:14px;text-align:center">Number hi tumhari ID hai. Dusre ko apna Number de do.</p>
</div></div>

<div id="appPage">
<div class="topBar"><div><h2 id="helloName">Hi 👋</h2><span id="myNumShow"></span></div><button class="logoutBtn" onclick="doLogout()">Logout</button></div>
<div class="tabs">
<button id="tabAdd" onclick="switchTab('add')">Add Contacts</button>
<button id="tabChat" class="active" onclick="switchTab('chat')">Chat</button>
<button id="tabHist" onclick="switchTab('hist')">History</button>
</div>

<!-- ADD -->
<div id="pageAdd" class="card" style="display:none">
<div class="stickyHead"><b style="font-size:17px">Add Contact</b><p style="color:#9ca3af;font-size:12px;margin-top:4px">Number daalo, Contact save ho jayega.</p></div>
<div class="addForm"><input id="addNum" placeholder="Number likho" inputmode="numeric"><input id="addName" placeholder="Naam likho"></div>
<button class="btnGreen" onclick="saveContact()">+ Save Contact</button>
<div class="listScroll" id="addList"></div>
</div>

<!-- CHAT / CONTACTS -->
<div id="pageChat" class="card">
<div class="stickyHead">
<div class="searchBox">🔍 <input id="searchInp" placeholder="Search..." oninput="renderContacts()"></div>
<div class="filterRow"><button class="active" onclick="setFilter('all',this)">All</button><button onclick="setFilter('Family',this)">Family</button><button onclick="setFilter('Friends',this)">Friends</button></div>
</div>
<div class="listScroll" id="contactList"></div>
</div>

<!-- HISTORY -->
<div id="pageHist" class="card" style="display:none">
<div class="stickyHead"><b style="font-size:17px">History</b><p style="color:#9ca3af;font-size:12px;margin-top:4px">Pichhli Calls</p></div>
<div class="listScroll" id="histList"></div>
</div>
</div>

<!-- INCOMING -->
<div id="incomingBox">
<div class="avatar" id="incAvatar">A</div>
<div style="flex:1"><b id="incName">Call...</b><br><small id="incType" style="color:#9ca3af"></small></div>
<button class="ctrl red" onclick="rejectCall()">✕</button>
<button class="ctrl green" onclick="acceptCall()">📞</button>
</div>

<!-- CALL SCREEN -->
<div id="callScreen">
<div class="callTop"><b id="callName">Abbu</b><p id="callStatus">Connecting...</p><p id="callTimer">00:00</p></div>
<video id="remoteVideo" playsinline></video>
<video id="myVideo" playsinline muted style="position:absolute;right:14px;top:110px;width:110px;height:150px;border-radius:14px;object-fit:cover;background:#222;display:none"></video>
<audio id="remoteAudio" autoplay playsinline></audio>
<div class="callControls">
<button class="ctrl" id="muteBtn" onclick="toggleMute()">🎤<small>Mute</small></button>
<button class="ctrl active" id="spkBtn" onclick="toggleSpeaker()">🔊<small>Speaker</small></button>
<button class="ctrl" id="vidBtn" onclick="toggleVideo()" style="display:none">📹<small>Video</small></button>
<button class="ctrl red" onclick="endCall()">📞<small>End</small></button>
</div></div>

<div class="toast" id="toast"></div>

<script>
let myName='',myNum='',peer=null,peerId='',myStream=null,currentCall=null,currentPeerNum='',isVideoCall=false,isMuted=false,isSpeaker=true,isVideoOn=false,callTimerInt=null,callSec=0,curFilter='all',incomingCallObj=null,onlineMap={};
let contacts=JSON.parse(localStorage.getItem('fam_contacts')||'[]');
let history=JSON.parse(localStorage.getItem('fam_history')||'[]');

// ---------- LOGIN ----------
function doLogin(){
  myName=document.getElementById('myName').value.trim();
  myNum=document.getElementById('myNum').value.trim().replace(/\D/g,'');
  if(!myName||myNum.length<7){showToast('Naam aur Number daalo');return}
  localStorage.setItem('fam_name',myName);localStorage.setItem('fam_num',myNum);
  startApp();
}
function doLogout(){localStorage.removeItem('fam_name');localStorage.removeItem('fam_num');location.reload()}
window.onload=()=>{let n=localStorage.getItem('fam_name'),m=localStorage.getItem('fam_num');if(n&&m){document.getElementById('myName').value=n;document.getElementById('myNum').value=m;startApp()}};

function startApp(){
  myName=localStorage.getItem('fam_name');myNum=localStorage.getItem('fam_num');
  document.getElementById('loginPage').style.display='none';
  document.getElementById('appPage').style.display='block';
  document.getElementById('helloName').innerText='Hi, '+myName+' 👋';
  document.getElementById('myNumShow').innerText='My Number: '+myNum;
  renderContacts();renderHistory();initPeer();initMQTT();
}
function showToast(t){let e=document.getElementById('toast');e.innerText=t;e.style.display='block';setTimeout(()=>e.style.display='none',2200)}

// ---------- TABS ----------
function switchTab(t){
  ['Add','Chat','Hist'].forEach(x=>document.getElementById('page'+x).style.display='none');
  ['tabAdd','tabChat','tabHist'].forEach(x=>document.getElementById(x).classList.remove('active'));
  if(t==='add'){document.getElementById('pageAdd').style.display='block';document.getElementById('tabAdd').classList.add('active');renderAddList()}
  if(t==='chat'){document.getElementById('pageChat').style.display='block';document.getElementById('tabChat').classList.add('active');renderContacts()}
  if(t==='hist'){document.getElementById('pageHist').style.display='block';document.getElementById('tabHist').classList.add('active');renderHistory()}
}
function setFilter(f,el){curFilter=f;document.querySelectorAll('.filterRow button').forEach(b=>b.classList.remove('active'));el.classList.add('active');renderContacts()}

// ---------- CONTACTS ----------
function saveContact(){
  let num=document.getElementById('addNum').value.trim().replace(/\D/g,'');
  let nm=document.getElementById('addName').value.trim()||num;
  if(num.length<7){showToast('Sahi Number daalo');return}
  if(!contacts.find(c=>c.num===num)){contacts.push({num:num,name:nm,group:'Family'});localStorage.setItem('fam_contacts',JSON.stringify(contacts))}
  document.getElementById('addNum').value='';document.getElementById('addName').value='';
  showToast('Contact Saved ✓');renderContacts();renderAddList();switchTab('chat');
}
function renderAddList(){
  let el=document.getElementById('addList');
  if(!contacts.length){el.innerHTML='<div class="empty">Abhi koi Contact nahi hai.</div>';return}
  el.innerHTML=contacts.map(c=>`<div class="contact"><div class="avatar">${c.name[0].toUpperCase()}<span class="dot ${onlineMap[c.num]?'on':''}"></span></div><div class="cInfo"><b>${c.name}</b><small>${c.num} • ${onlineMap[c.num]?'Online':'Offline'}</small></div><button class="iconBtn" onclick="deleteContact('${c.num}')">🗑️</button></div>`).join('');
}
function deleteContact(num){contacts=contacts.filter(c=>c.num!==num);localStorage.setItem('fam_contacts',JSON.stringify(contacts));renderContacts();renderAddList()}
function renderContacts(){
  let q=(document.getElementById('searchInp').value||'').toLowerCase();
  let list=contacts.filter(c=>{if(curFilter!=='all'&&c.group!==curFilter)return false;if(q&&!(c.name.toLowerCase().includes(q)||c.num.includes(q)))return false;return true});
  let el=document.getElementById('contactList');
  if(!list.length){el.innerHTML='<div class="empty">Koi Contact nahi mila.<br>Add Contacts se add karo.</div>';return}
  el.innerHTML=list.map(c=>`<div class="contact"><div class="avatar">${c.name[0].toUpperCase()}<span class="dot ${onlineMap[c.num]?'on':''}"></span></div><div class="cInfo"><b>${c.name}</b><small>${c.num} • ${onlineMap[c.num]?'Online':'Offline'}</small></div><div class="callBtns"><button class="iconBtn green" onclick="makeCall('${c.num}','${c.name}',false)">📞</button><button class="iconBtn blue" onclick="makeCall('${c.num}','${c.name}',true)">📹</button></div></div>`).join('');
}
function renderHistory(){
  let el=document.getElementById('histList');
  if(!history.length){el.innerHTML='<div class="empty">Abhi koi History nahi hai.</div>';return}
  el.innerHTML=history.slice().reverse().map(h=>`<div class="log"><div class="avatar">${(h.name||'?')[0].toUpperCase()}</div><div class="cInfo"><b>${h.name}</b><small>${h.num} • ${h.type} • ${h.time}</small></div><button class="iconBtn green" onclick="makeCall('${h.num}','${h.name}',false)">📞</button></div>`).join('');
}
function addHistory(num,name,type){history.push({num:num,name:name,type:type,time:new Date().toLocaleString()});localStorage.setItem('fam_history',JSON.stringify(history));renderHistory()}

// ---------- MQTT - ONLINE SIGNAL ----------
let mqttClient=null;
function initMQTT(){
  try{
    let cid='fam_'+myNum+'_'+Math.floor(Math.random()*99999);
    mqttClient=new Paho.MQTT.Client('broker.hivemq.com',8884,'/mqtt',cid);
    mqttClient.onMessageArrived=(m)=>{try{let d=JSON.parse(m.payloadString);if(d.num&&d.num!==myNum){onlineMap[d.num]=Date.now();renderContacts()}}catch(e){}};
    mqttClient.connect({useSSL:true,onSuccess:()=>{mqttClient.subscribe('family_call_online');sendSignal({type:'online',num:myNum,name:myName})},onFailure:()=>{}});
  }catch(e){}
}
function sendSignal(obj){try{if(mqttClient&&mqttClient.isConnected()){mqttClient.send('family_call_online',JSON.stringify(obj))}}catch(e){}}

// ---------- PEER - KAHI SE KAHI BHI CALL ----------
const ICE_SERVERS=[
{urls:'stun:stun.l.google.com:19302'},
{urls:'stun:stun1.l.google.com:19302'},
{urls:'stun:stun2.l.google.com:19302'},
{urls:'turn:openrelay.metered.ca:80',username:'openrelayproject',credential:'openrelayproject'},
{urls:'turn:openrelay.metered.ca:443',username:'openrelayproject',credential:'openrelayproject'},
{urls:'turn:openrelay.metered.ca:443?transport=tcp',username:'openrelayproject',credential:'openrelayproject'},
{urls:'turn:relay1.expressturn.com:3478',username:'efJB4N2KX1G1X2Z1Y1',credential:'Q1W2E3R4T5Y6U7I8O9P0'},
{urls:'turn:relay1.expressturn.com:3478?transport=tcp',username:'efJB4N2KX1G1X2Z1Y1',credential:'Q1W2E3R4T5Y6U7I8O9P0'}
];
function initPeer(){
  peer=new Peer('family-'+myNum,{host:'0.peerjs.com',secure:true,port:443,config:{iceServers:ICE_SERVERS,iceCandidatePoolSize:10}});
  peer.on('open',id=>{peerId=id;sendSignal({type:'online',num:myNum,name:myName,pid:id,at:Date.now()});setInterval(()=>sendSignal({type:'online',num:myNum,name:myName,pid:id,at:Date.now()}),5000)});
  peer.on('call',incoming=>{
    if(!myStream){incomingCallObj=incoming;showIncoming(incoming.metadata||{});return}
    incomingCallObj=incoming;showIncoming(incoming.metadata||{});
  });
  peer.on('error',e=>{console.log('Peer error',e)});
}
function showIncoming(meta){
  document.getElementById('incName').innerText=(meta.fromName||'Unknown')+' Calling...';
  document.getElementById('incType').innerText=meta.isVideo?'Video Call':'Audio Call';
  document.getElementById('incAvatar').innerText=(meta.fromName||'U')[0].toUpperCase();
  document.getElementById('incomingBox').style.display='flex';
  try{let a=new Audio('https://actions.google.com/sounds/v1/alarms/phone_alerts_and_rings.ogg');a.loop=true;a.play().catch(()=>{});window._ring=a}catch(e){}
}
function stopRing(){try{if(window._ring){window._ring.pause();window._ring=null}}catch(e){}}

// ---------- CALL ----------
async function getMedia(video){
  try{
    if(myStream){myStream.getTracks().forEach(t=>t.stop())}
    myStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:video?{width:640,height:480}:false});
    myStream.getAudioTracks().forEach(t=>{t.enabled=true});
    if(video){let mv=document.getElementById('myVideo');mv.srcObject=myStream;mv.style.display='block';mv.play().catch(()=>{})}
    return true;
  }catch(e){alert('Mic / Camera Allow karo - Block mat karo.');return false}
}
async function makeCall(num,name,video){
  if(!await getMedia(video))return;
  isVideoCall=video;currentPeerNum=num;
  document.getElementById('callName').innerText=name;
  document.getElementById('callStatus').innerText='Calling...';
  document.getElementById('callScreen').style.display='flex';
  document.getElementById('vidBtn').style.display=video?'flex':'none';
  document.getElementById('myVideo').style.display=video?'block':'none';
  let call=peer.call('family-'+num,myStream,{metadata:{fromName:myName,fromNum:myNum,isVideo:video}});
  currentCall=call;handleCallEvents(call);addHistory(num,name,video?'Video':'Audio');
}
async function acceptCall(){
  stopRing();document.getElementById('incomingBox').style.display='none';
  let meta=incomingCallObj.metadata||{};isVideoCall=!!meta.isVideo;currentPeerNum=meta.fromNum||'';
  if(!await getMedia(isVideoCall))return;
  document.getElementById('callName').innerText=meta.fromName||'Call';
  document.getElementById('callStatus').innerText='Connecting...';
  document.getElementById('callScreen').style.display='flex';
  document.getElementById('vidBtn').style.display=isVideoCall?'flex':'none';
  document.getElementById('myVideo').style.display=isVideoCall?'block':'none';
  incomingCallObj.answer(myStream);
  currentCall=incomingCallObj;handleCallEvents(incomingCallObj);addHistory(meta.fromNum||'',meta.fromName||'','Incoming '+(isVideoCall?'Video':'Audio'));
}
function rejectCall(){stopRing();document.getElementById('incomingBox').style.display='none';if(incomingCallObj){try{incomingCallObj.close()}catch(e){}}incomingCallObj=null}
function handleCallEvents(call){
  call.on('stream',rs=>{
    startConnectedTimer();
    try{let AC=window.AudioContext||window.webkitAudioContext;if(AC){let ac=new AC();ac.resume()}}catch(e){}
    let rv=document.getElementById('remoteVideo');let a=document.getElementById('remoteAudio');
    a.srcObject=rs;a.muted=false;a.volume=1;
    if(!isVideoCall){rv.srcObject=null}else{rv.srcObject=rs;rv.muted=false;rv.play().catch(()=>{})}
    a.play().catch(()=>setTimeout(()=>a.play().catch(()=>{}),500));
    document.getElementById('callStatus').innerText=isVideoCall?'Video Call chal rahi hai...':'Audio Call chal rahi hai...';
    setTimeout(()=>{try{if(call.peerConnection&&call.peerConnection.iceConnectionState!=='connected'&&call.peerConnection.iceConnectionState!=='completed'){call.peerConnection.restartIce()}}catch(e){}},5000);
  });
  call.on('close',()=>{endCall(true)});
  call.on('error',()=>{endCall(true)});
}
function startConnectedTimer(){callSec=0;clearInterval(callTimerInt);callTimerInt=setInterval(()=>{callSec++;let m=String(Math.floor(callSec/60)).padStart(2,'0');let s=String(callSec%60).padStart(2,'0');document.getElementById('callTimer').innerText=m+':'+s},1000)}
function toggleMute(){isMuted=!isMuted;if(myStream){myStream.getAudioTracks().forEach(t=>t.enabled=!isMuted)}document.getElementById('muteBtn').classList.toggle('active',isMuted)}
function toggleSpeaker(){isSpeaker=!isSpeaker;let a=document.getElementById('remoteAudio');a.muted=!isSpeaker;a.volume=isSpeaker?1:0;document.getElementById('spkBtn').classList.toggle('active',isSpeaker)}
function toggleVideo(){isVideoOn=!isVideoOn;if(myStream){myStream.getVideoTracks().forEach(t=>t.enabled=isVideoOn)}document.getElementById('vidBtn').classList.toggle('active',isVideoOn)}
function endCall(silent){clearInterval(callTimerInt);stopRing();if(currentCall){try{currentCall.close()}catch(e){}}currentCall=null;if(myStream){myStream.getTracks().forEach(t=>t.stop());myStream=null}document.getElementById('remoteAudio').srcObject=null;document.getElementById('remoteVideo').srcObject=null;document.getElementById('callScreen').style.display='none';document.getElementById('incomingBox').style.display='none';document.getElementById('myVideo').style.display='none';if(!silent)showToast('Call Ended')}
</script>
</body>
</html>
